name: mihir-portfolio

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  model-init:
    image: ollama/ollama:latest
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["ollama"]
    command: ["pull", "${RAG_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  indexer:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["maintenance"]
    restart: "no"
    user: "0:0"
    env_file:
      - ${PORTFOLIO_ENV_FILE:-.env}
    environment:
      RAG_ENV: production
      RAG_RETRIEVAL_MODE: local_hybrid
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_LOCAL_INDEX_DIR: /app/instance/rag_local_index
    command: ["python", "scripts/build_local_rag_index.py"]
    volumes:
      - rag_local_index:/app/instance/rag_local_index
    depends_on:
      ollama:
        condition: service_healthy

  portfolio:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${PORTFOLIO_ENV_FILE:-.env}
    environment:
      PORT: "8000"
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-local_hybrid}
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_LOCAL_INDEX_DIR: /app/instance/rag_local_index
    volumes:
      - rag_local_index:/app/instance/rag_local_index
    expose:
      - "8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/portfolio.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      portfolio:
        condition: service_healthy

  nginx-bootstrap:
    image: nginx:1.27-alpine
    profiles: ["maintenance"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["maintenance"]
    entrypoint: ["certbot"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  ollama_models:
  rag_local_index:
  certbot_conf:
  certbot_webroot:
