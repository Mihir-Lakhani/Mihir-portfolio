AWSTemplateFormatVersion: "2010-09-09"
Description: Email-only AWS cost alerts for the single-VM portfolio deployment.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives budget alerts.
  MonthlyCostLimitUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Conservative monthly alert threshold in USD. This is an alert, not a spending cap.

Resources:
  PortfolioMonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-cost"
        BudgetLimit:
          Amount: !Ref MonthlyCostLimitUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
